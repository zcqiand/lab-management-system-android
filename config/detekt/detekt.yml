build:
  maxIssues: 0
complexity:
  TooManyFunctions:
    active: true
    excludes: ['**/HarnessTraceListener.kt', '**/src/test/**/*.kt'] # porter 类职责单一豁免同前；测试类多 @Test 方法即形态本身（逐测一行为一断言），测试类豁免 2026-10-19 会话持久化切片
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # Compose 官方惯例：UI 组件函数 PascalCase（AOSP/Compose 指南），定向豁免 2026-10-19 登录切片
exceptions:
  excludes: ['**/ui/AuthViewModel.kt', '**/app/LoginWire.kt', '**/app/ReceiptWire.kt', '**/app/AssignWire.kt', '**/ui/ReceiptsViewModel.kt', '**/ui/ReceiptDetailViewModel.kt', '**/ui/ReceiptDeleteViewModel.kt', '**/ui/AssignTaskViewModel.kt', '**/app/DataEntryWire.kt', '**/ui/DataEntryViewModel.kt', '**/app/ReportWire.kt', '**/app/SampleExtWire.kt', '**/ui/SampleExtViewModel.kt'] # seam 边界归一任意传输层异常为 AuthError.Unreachable、VM 捕 provider 抛出落 error 态，泛捕即职责本身（定向豁免 2026-10-19 登录切片；ReceiptWire 同位、ReceiptsViewModel 2026-10-19 列表切片；AssignWire/AssignTaskViewModel 2026-10-20 任务分配切片同位；DataEntryWire/DataEntryViewModel 2026-10-20 数据录入切片同位；ReportWire 2026-10-20 报告四阶段切片同位；SampleExtWire/SampleExtViewModel 2026-10-20 样品补录切片同位）
